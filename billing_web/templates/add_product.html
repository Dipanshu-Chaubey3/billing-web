<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Product</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            padding-top: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
    </style>
</head>
<body class="text-gray-800">
    <div class="container mx-auto p-6 max-w-2xl">
        <h2 class="text-3xl font-bold text-white mb-6 drop-shadow-md fade-in">Add Product</h2>
        <div class="glass-card p-6 space-y-6">
            <form method="post" class="space-y-4">
                <div>
                    <label class="block text-lg font-semibold text-gray-700">Name:</label>
                    <input name="name" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
                </div>
                <div>
                    <label class="block text-lg font-semibold text-gray-700">Price:</label>
                    <input name="price" type="number" step="0.01" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
                </div>
                <div>
                    <label class="block text-lg font-semibold text-gray-700">Stock:</label>
                    <input name="stock" type="number" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
                </div>
                <div>
                    <label class="block text-lg font-semibold text-gray-700">GST %:</label>
                    <input name="gst" type="number" step="0.01" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
                </div>
                <button type="submit" class="bg-green-500 text-white p-2 rounded-lg hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-400 w-full flex items-center justify-center">
                    <i class="fas fa-plus mr-2"></i> Add
                </button>
            </form>

            <h3 class="text-2xl font-semibold text-gray-700 mt-6 mb-4 fade-in" style="animation-delay: 0.2s">Products List</h3>
            <ul class="list-disc pl-5 space-y-2">
                {% for p in products %}
                    <li class="fade-in" style="animation-delay: { loop.index * 0.1 + 0.3 }s">
                        {{p.name}} - ₹{{p.price}} - Stock: {{p.stock}} - GST: {{p.gst_rate}}%
                    </li>
                {% endfor %}
            </ul>
            {% if not products %}
                <p class="text-red-500 text-center fade-in" style="animation-delay: 0.4s">No products added yet.</p>
            {% endif %}
        </div>
        <a href="/" class="block mt-6 text-purple-600 hover:text-purple-800 text-center underline fade-in" style="animation-delay: 0.5s">Home</a>
    </div>
</body>
</html>
