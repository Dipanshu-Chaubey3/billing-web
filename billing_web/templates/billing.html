<!DOCTYPE html>
<html lang="en">
<head>
    <title>Create Bill</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        body {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin: 0;
            font-family: 'Poppins', sans-serif;
            padding-top: 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');
    </style>
</head>
<body class="text-gray-800">
    <div class="container mx-auto p-6 max-w-4xl">
        <h2 class="text-3xl font-bold text-white mb-6 drop-shadow-md fade-in">Create Bill</h2>
        <div class="glass-card p-6">
            <form method="post" onsubmit="return validateForm()" class="space-y-6">
                <div>
                    <label class="block text-lg font-semibold text-gray-700">Customer:</label>
                    <select name="customer" class="w-full p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400" required>
                        {% if customers %}
                            {% for c in customers %}
                                <option value="{{c.id}}">{{c.name}}</option>
                            {% endfor %}
                        {% else %}
                            <option value="" disabled selected>No customers available</option>
                        {% endif %}
                    </select>
                </div>

                <div>
                    <table id="billTable" class="w-full border-collapse">
                        <thead>
                            <tr class="bg-gray-200">
                                <th class="p-2 text-left">Product</th>
                                <th class="p-2 text-left">Qty</th>
                                <th class="p-2 text-left">Price</th>
                                <th class="p-2 text-left">GST</th>
                                <th class="p-2 text-left">Total</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                    <div class="flex space-x-4 mt-4">
                        <button type="button" onclick="addRow()" class="bg-blue-500 text-white p-2 rounded-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-400 flex items-center">
                            <i class="fas fa-plus mr-2"></i> Add Product
                        </button>
                        <button type="button" onclick="removeRow()" class="bg-red-500 text-white p-2 rounded-lg hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-400 flex items-center">
                            <i class="fas fa-minus mr-2"></i> Remove Product
                        </button>
                    </div>
                </div>

                <div class="space-y-2">
                    <div class="totals text-lg" id="subtotal">Subtotal: ₹0.00</div>
                    <div class="totals text-lg" id="gst_total">GST: ₹0.00</div>
                    <div class="totals text-lg" id="final_total">Total: ₹0.00</div>
                    <input type="hidden" name="products_data" id="products_data">
                </div>

                <button type="submit" class="bg-green-500 text-white p-2 rounded-lg hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-green-400 w-full">
                    <i class="fas fa-file-invoice mr-2"></i> Generate Invoice
                </button>
            </form>
            <a href="/" class="block mt-4 text-purple-600 hover:text-purple-800 text-center underline">Home</a>
            <div id="errorMessage" class="error mt-2 hidden"></div>
        </div>
    </div>

    <script>
        let products = { products|tojson|safe };

        function addRow() {
            if (!products || products.length === 0) {
                document.getElementById('errorMessage').classList.remove('hidden');
                document.getElementById('errorMessage').textContent = "No products available. Please add products first.";
                return;
            }
            let table = document.getElementById("billTable").getElementsByTagName('tbody')[0];
            let row = table.insertRow();
            let cell1 = row.insertCell(0);
            let cell2 = row.insertCell(1);
            let cell3 = row.insertCell(2);
            let cell4 = row.insertCell(3);
            let cell5 = row.insertCell(4);

            let select = document.createElement("select");
            select.name = "product";
            select.className = "p-2 border rounded-lg";
            select.onchange = updateRowTotal;
            products.forEach(p => {
                let option = document.createElement("option");
                option.value = p.id;
                option.text = `${p.name} (₹${p.price.toFixed(2)}, Stock: ${p.stock})`;
                select.appendChild(option);
            });
            cell1.appendChild(select);

            let qty = document.createElement("input");
            qty.type = "number";
            qty.name = "quantity";
            qty.value = 1;
            qty.min = 1;
            qty.className = "p-2 border rounded-lg";
            qty.oninput = updateRowTotal;
            cell2.appendChild(qty);

            let price = document.createElement("span");
            price.textContent = "0.00";
            cell3.appendChild(price);

            let gst = document.createElement("span");
            gst.textContent = "0.00";
            cell4.appendChild(gst);

            let total = document.createElement("span");
            total.textContent = "0.00";
            cell5.appendChild(total);

            updateRowTotal();
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function removeRow() {
            let table = document.getElementById("billTable").getElementsByTagName('tbody')[0];
            if (table.rows.length > 0) {
                table.deleteRow(table.rows.length - 1);
                updateTotals();
            } else {
                alert("At least one product row is required.");
            }
        }

        function updateRowTotal() {
            let table = document.getElementById("billTable").getElementsByTagName('tbody')[0];
            for (let i = 0; i < table.rows.length; i++) {
                let row = table.rows[i];
                let pid = row.cells[0].children[0].value;
                let product = products.find(p => p.id == parseInt(pid));
                let qtyInput = row.cells[1].children[0];
                let qty = parseInt(qtyInput.value) || 1;
                
                if (qty > product.stock) {
                    qtyInput.value = product.stock || 1;
                    qty = parseInt(qtyInput.value);
                    alert(`Stock for ${product.name} is limited to ${product.stock}.`);
                }
                if (qty < 1) {
                    qtyInput.value = 1;
                    qty = 1;
                }

                let price = product.price;
                let gst_amount = price * qty * product.gst_rate / 100;
                let total = price * qty + gst_amount;

                row.cells[2].children[0].textContent = price.toFixed(2);
                row.cells[3].children[0].textContent = gst_amount.toFixed(2);
                row.cells[4].children[0].textContent = total.toFixed(2);
            }
            updateTotals();
        }

        function updateTotals() {
            let table = document.getElementById("billTable").getElementsByTagName('tbody')[0];
            let subtotal = 0;
            let gst_total = 0;
            let final_total = 0;
            let products_data = [];

            for (let i = 0; i < table.rows.length; i++) {
                let row = table.rows[i];
                let qty = parseInt(row.cells[1].children[0].value) || 1;
                subtotal += parseFloat(row.cells[2].children[0].textContent) * qty;
                gst_total += parseFloat(row.cells[3].children[0].textContent);
                final_total += parseFloat(row.cells[4].children[0].textContent);
                products_data.push({
                    product_id: row.cells[0].children[0].value,
                    quantity: qty
                });
            }

            document.getElementById("subtotal").textContent = `Subtotal: ₹${subtotal.toFixed(2)}`;
            document.getElementById("gst_total").textContent = `GST: ₹${gst_total.toFixed(2)}`;
            document.getElementById("final_total").textContent = `Total: ₹${final_total.toFixed(2)}`;
            document.getElementById("products_data").value = JSON.stringify(products_data);
        }

        window.onload = function() {
            if (products && products.length > 0) {
                addRow();
            } else {
                document.getElementById('errorMessage').classList.remove('hidden');
                document.getElementById('errorMessage').textContent = "No products available. Please add products first.";
            }
        }

        function validateForm() {
            let table = document.getElementById("billTable").getElementsByTagName('tbody')[0];
            if (table.rows.length === 0) {
                alert("Please add at least one product to the bill.");
                return false;
            }
            let products_data = JSON.parse(document.getElementById("products_data").value);
            for (let item of products_data) {
                if (!item.product_id || item.quantity < 1) {
                    alert("Invalid product or quantity selected.");
                    return false;
                }
            }
            return true;
        }
    </script>
</body>
</html>
