<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customers</title></head><body><h1>Add customer</h1><p><a href="/">Home</a> · <a href="/billing">Create bill</a></p><form method="post"><label>Name <input name="name" maxlength="100" required></label><br><label>Phone <input name="phone" maxlength="20" required></label><br><button type="submit">Save customer</button></form><h2>Customers</h2><table border="1" cellpadding="6"><tr><th>Name</th><th>Phone</th></tr>{% for c in customers %}<tr><td>{{ c.name }}</td><td>{{ c.phone }}</td></tr>{% else %}<tr><td colspan="2">No customers yet.</td></tr>{% endfor %}</table></body></html>
