<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create bill</title><style>body{font-family:Arial,sans-serif;max-width:850px;margin:2rem auto;padding:0 1rem}label{display:block;margin:.8rem 0}table{border-collapse:collapse;width:100%;margin:1rem 0}td,th{border:1px solid #ddd;padding:.5rem;text-align:left}button{padding:.6rem 1rem}</style></head><body><h1>Create bill</h1><p><a href="/">Home</a> · <a href="/add_product">Products</a> · <a href="/add_customer">Customers</a></p>{% if not customers %}<p>Add a customer before creating a bill.</p>{% endif %}{% if not products %}<p>Add a product before creating a bill.</p>{% endif %}<form method="post" id="bill-form"><label>Customer <select name="customer" required>{% for c in customers %}<option value="{{ c.id }}">{{ c.name }} ({{ c.phone }})</option>{% endfor %}</select></label><h2>Items</h2><table id="items"><thead><tr><th>Product</th><th>Available stock</th><th>Quantity</th><th></th></tr></thead><tbody id="item-rows"></tbody></table><button type="button" id="add-row">Add item</button><input type="hidden" name="products_data" id="products-data"><p><button type="submit" {% if not customers or not products %}disabled{% endif %}>Create PDF invoice</button></p></form><script>const products={{ products|map(attribute='id')|list|tojson }};const productInfo={{ products|map(attribute='name')|list|tojson }};const stockInfo={{ products|map(attribute='stock')|list|tojson }};const rows=document.getElementById('item-rows');function addRow(){const tr=document.createElement('tr');const select=document.createElement('select');select.required=true;products.forEach((id,i)=>{const opt=document.createElement('option');opt.value=id;opt.textContent=productInfo[i]+' (₹, GST)';select.appendChild(opt)});const qty=document.createElement('input');qty.type='number';qty.min='1';qty.step='1';qty.value='1';qty.required=true;const stock=document.createElement('span');function showStock(){stock.textContent=stockInfo[select.selectedIndex]??0}select.addEventListener('change',showStock);showStock();const remove=document.createElement('button');remove.type='button';remove.textContent='Remove';remove.onclick=()=>tr.remove();for(const cell of [select,stock,qty,remove]){const td=document.createElement('td');td.appendChild(cell);tr.appendChild(td)}rows.appendChild(tr)}document.getElementById('add-row').addEventListener('click',addRow);document.getElementById('bill-form').addEventListener('submit',e=>{const data=[];for(const tr of rows.querySelectorAll('tr')){const select=tr.querySelector('select');const qty=tr.querySelector('input');if(!qty.value||Number(qty.value)<1||!Number.isInteger(Number(qty.value))){e.preventDefault();alert('Enter a positive whole-number quantity.');return}data.push({product_id:Number(select.value),quantity:Number(qty.value)})}if(!data.length){e.preventDefault();alert('Add at least one item.');return}document.getElementById('products-data').value=JSON.stringify(data)});if(products.length)addRow();</script></body></html>
