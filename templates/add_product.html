<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Products</title></head><body><h1>Add product</h1><p><a href="/">Home</a> · <a href="/billing">Create bill</a></p><form method="post"><label>Name <input name="name" maxlength="100" required></label><br><label>Price ₹ <input type="number" name="price" min="0" step="0.01" required></label><br><label>Stock <input type="number" name="stock" min="0" step="1" required></label><br><label>GST % <input type="number" name="gst" min="0" max="100" step="0.01" required></label><br><button type="submit">Save product</button></form><h2>Products</h2><table border="1" cellpadding="6"><tr><th>Name</th><th>Price</th><th>Stock</th><th>GST %</th></tr>{% for p in products %}<tr><td>{{ p.name }}</td><td>₹{{ '%.2f'|format(p.price) }}</td><td>{{ p.stock }}</td><td>{{ p.gst_rate }}</td></tr>{% else %}<tr><td colspan="4">No products yet.</td></tr>{% endfor %}</table></body></html>
